apiVersion: v1
kind: Service
metadata:
  name: {{ include "grl-observability.clickhouse" . }}
  labels: {{- include "grl-observability.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "grl-observability.selector" . | nindent 4 }}
  ports:
    - name: native
      port: 9000
      targetPort: native
    - name: http
      port: 8123
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "grl-observability.clickhouse" . }}
  labels: {{- include "grl-observability.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "grl-observability.clickhouse" . }}
  replicas: 1
  selector:
    matchLabels: {{- include "grl-observability.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "grl-observability.selector" . | nindent 8 }}
    spec:
      {{- with .Values.clickhouse.nodeSelector }}nodeSelector: {{- toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.clickhouse.tolerations }}tolerations: {{- toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.clickhouse.affinity }}affinity: {{- toYaml . | nindent 8 }}{{- end }}
      containers:
        - name: clickhouse
          image: {{ .Values.clickhouse.image | quote }}
          ports:
            - name: native
              containerPort: 9000
            - name: http
              containerPort: 8123
          env:
            - name: CLICKHOUSE_DB
              value: {{ .Values.clickhouse.database | quote }}
            - name: CLICKHOUSE_USER
              valueFrom: {secretKeyRef: {name: {{ include "grl-observability.clickhouse" . }}-credentials, key: username}}
            - name: CLICKHOUSE_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "grl-observability.clickhouse" . }}-credentials, key: password}}
          readinessProbe:
            httpGet: {path: /ping, port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /ping, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources: {{- toYaml .Values.clickhouse.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/clickhouse}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.clickhouse.storage.storageClassName }}storageClassName: {{ . | quote }}{{- end }}
        resources:
          requests: {storage: {{ .Values.clickhouse.storage.size | quote }}}
