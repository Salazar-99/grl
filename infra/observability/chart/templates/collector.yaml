apiVersion: v1
kind: Service
metadata:
  name: {{ include "grl-observability.collector" . }}
  labels:
    {{- include "grl-observability.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: collector
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: otlp-http
      port: {{ .Values.otelCollector.service.port }}
      targetPort: otlp-http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grl-observability.collector" . }}-config
  labels:
    {{- include "grl-observability.labels" . | nindent 4 }}
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      basicauth/server:
        htpasswd:
          inline: |
            {{ htpasswd .Values.otelCollector.username .Values.otelCollector.password }}
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
            auth:
              authenticator: basicauth/server
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch:
        send_batch_size: 512
        timeout: 5s
    exporters:
      clickhouse/metrics:
        endpoint: tcp://{{ include "grl-observability.clickhouse" . }}:9000?dial_timeout=10s
        username: ${env:CLICKHOUSE_USERNAME}
        password: ${env:CLICKHOUSE_PASSWORD}
        database: {{ .Values.clickhouse.database }}
        create_schema: false
        metrics_tables:
          gauge: {name: grl_metrics_landing}
          sum: {name: grl_metrics_sum_landing}
          histogram: {name: grl_metrics_histogram_landing}
        sending_queue: {enabled: true, queue_size: 5000}
        retry_on_failure: {enabled: true, max_elapsed_time: 300s}
      clickhouse/logs:
        endpoint: tcp://{{ include "grl-observability.clickhouse" . }}:9000?dial_timeout=10s
        username: ${env:CLICKHOUSE_USERNAME}
        password: ${env:CLICKHOUSE_PASSWORD}
        database: {{ .Values.clickhouse.database }}
        create_schema: false
        logs_table_name: grl_logs
        traces_table_name: grl_traces
        sending_queue: {enabled: true, queue_size: 5000}
        retry_on_failure: {enabled: true, max_elapsed_time: 300s}
    service:
      extensions: [health_check, basicauth/server]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse/metrics]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse/logs]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse/logs]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "grl-observability.collector" . }}
  labels:
    {{- include "grl-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  replicas: {{ .Values.otelCollector.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        # Roll the collector when its generated auth or ClickHouse settings change.
        checksum/config: {{ printf "%s:%s:%s:%s:%s" .Values.otelCollector.username .Values.otelCollector.password .Values.clickhouse.database .Values.clickhouse.username .Values.clickhouse.password | sha256sum }}
      labels:
        app.kubernetes.io/component: collector
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.otelCollector.nodeSelector }}nodeSelector: {{ toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.otelCollector.tolerations }}tolerations: {{ toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.otelCollector.affinity }}affinity: {{ toYaml . | nindent 8 }}{{- end }}
      containers:
        - name: collector
          image: {{ .Values.otelCollector.image | quote }}
          args: ["--config=/conf/collector.yaml"]
          ports:
            - name: otlp-http
              containerPort: 4318
          env:
            - name: OTEL_AUTH_USERNAME
              valueFrom:
                secretKeyRef: {name: {{ include "grl-observability.collector" . }}-credentials, key: username}
            - name: OTEL_AUTH_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "grl-observability.collector" . }}-credentials, key: password}
            - name: CLICKHOUSE_USERNAME
              valueFrom:
                secretKeyRef: {name: {{ include "grl-observability.clickhouse" . }}-credentials, key: username}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "grl-observability.clickhouse" . }}-credentials, key: password}
          readinessProbe:
            httpGet: {path: /, port: 13133}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 13133}
            initialDelaySeconds: 15
          resources:
            {{- toYaml .Values.otelCollector.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /conf
      volumes:
        - name: config
          configMap: {name: {{ include "grl-observability.collector" . }}-config}
