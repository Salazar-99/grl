apiVersion: v1
kind: Service
metadata:
  name: {{ include "grl-observability.grafana" . }}
  labels:
    {{- include "grl-observability.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grl-observability.grafana" . }}-provisioning
  labels:
    {{- include "grl-observability.labels" . | nindent 4 }}
data:
  grafana.ini: |
    [auth.anonymous]
    enabled = {{ .Values.grafana.anonymous.enabled }}
    org_role = {{ .Values.grafana.anonymous.orgRole }}
    [users]
    allow_sign_up = false
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: GRL ClickHouse
        uid: clickhouse
        type: grafana-clickhouse-datasource
        access: proxy
        jsonData:
          # The ClickHouse datasource v4 reads connection details from jsonData.
          # `url` was accepted by older datasource versions but leaves v4's host
          # empty, causing every dashboard query to fail at client creation.
          host: {{ include "grl-observability.clickhouse" . }}
          defaultDatabase: {{ .Values.clickhouse.database }}
          protocol: http
          port: 8123
          username: {{ .Values.clickhouse.username | quote }}
        secureJsonData:
          password: ${CLICKHOUSE_PASSWORD}
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: GRL
        orgId: 1
        folder: GRL
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
  dashboard.json: |-
{{ .Files.Get "files/grl-dashboard.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "grl-observability.grafana" . }}
  labels:
    {{- include "grl-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: grafana
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: grafana
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.grafana.nodeSelector }}nodeSelector: {{ toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.grafana.tolerations }}tolerations: {{ toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.grafana.affinity }}affinity: {{ toYaml . | nindent 8 }}{{- end }}
      {{- if .Values.grafana.installPlugin }}
      # The Grafana data PVC masks /var/lib/grafana from the image. Copy the
      # baked-in panel into that PVC before Grafana starts.
      initContainers:
        - name: install-grl-traces-panel
          image: {{ .Values.grafana.image | quote }}
          command: ["sh", "-ec", "mkdir -p /data/plugins/grl-traces-panel && cp -a /var/lib/grafana/plugins/grl-traces-panel/. /data/plugins/grl-traces-panel/"]
          volumeMounts:
            - {name: data, mountPath: /data}
      {{- end }}
      containers:
        - name: grafana
          image: {{ .Values.grafana.image | quote }}
          ports: [{name: http, containerPort: 3000}]
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: {secretKeyRef: {name: {{ include "grl-observability.grafana" . }}-admin, key: admin-user}}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "grl-observability.grafana" . }}-admin, key: admin-password}}
            - name: CLICKHOUSE_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "grl-observability.clickhouse" . }}-credentials, key: password}}
            - name: GF_PATHS_CONFIG
              value: /etc/grafana/grafana.ini
          readinessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 10}
          livenessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 30}
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: provisioning, mountPath: /etc/grafana/grafana.ini, subPath: grafana.ini}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml}
            - {name: provisioning, mountPath: /var/lib/grafana/dashboards/grl-dashboard.json, subPath: dashboard.json}
      volumes:
        - name: provisioning
          configMap: {name: {{ include "grl-observability.grafana" . }}-provisioning}
        - name: data
          persistentVolumeClaim: {claimName: {{ include "grl-observability.grafana" . }}-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "grl-observability.grafana" . }}-data
  labels:
    {{- include "grl-observability.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.grafana.storage.storageClassName }}storageClassName: {{ . | quote }}{{- end }}
  resources:
    requests: {storage: {{ .Values.grafana.storage.size | quote }}}
