apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grl-observability.clickhouse" . }}-schema
  labels:
    {{- include "grl-observability.labels" . | nindent 4 }}
data:
  schema.sql: |-
{{ .Files.Get "files/schema.sql" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "grl-observability.clickhouse" . }}-schema-{{ .Release.Revision }}
  labels:
    {{- include "grl-observability.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app.kubernetes.io/component: schema
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: schema
          image: {{ .Values.clickhouse.image | quote }}
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "grl-observability.clickhouse" . }}-credentials
                  key: password
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              until clickhouse-client --host {{ include "grl-observability.clickhouse" . }}
              --user {{ .Values.clickhouse.username }} --password "$CLICKHOUSE_PASSWORD"
              --query 'SELECT 1'; do sleep 3; done;
              clickhouse-client --host {{ include "grl-observability.clickhouse" . }}
              --user {{ .Values.clickhouse.username }} --password "$CLICKHOUSE_PASSWORD"
              --multiquery < /schema/schema.sql;
              clickhouse-client --host {{ include "grl-observability.clickhouse" . }}
              --user {{ .Values.clickhouse.username }} --password "$CLICKHOUSE_PASSWORD"
              --multiquery --query "ALTER TABLE grl_metrics_landing MODIFY TTL TimeUnix + INTERVAL {{ .Values.clickhouse.retentionDays }} DAY; ALTER TABLE grl_metrics_sum_landing MODIFY TTL TimeUnix + INTERVAL {{ .Values.clickhouse.retentionDays }} DAY; ALTER TABLE grl_metrics_histogram_landing MODIFY TTL TimeUnix + INTERVAL {{ .Values.clickhouse.retentionDays }} DAY; ALTER TABLE grl_metrics MODIFY TTL TimeUnix + INTERVAL {{ .Values.clickhouse.retentionDays }} DAY; ALTER TABLE grl_logs MODIFY TTL Timestamp + INTERVAL {{ .Values.clickhouse.retentionDays }} DAY; ALTER TABLE grl_traces MODIFY TTL Timestamp + INTERVAL {{ .Values.clickhouse.retentionDays }} DAY; ALTER TABLE grl_trajectories MODIFY TTL TimeUnix + INTERVAL {{ .Values.clickhouse.retentionDays }} DAY;"
          volumeMounts:
            - name: schema
              mountPath: /schema
      volumes:
        - name: schema
          configMap:
            name: {{ include "grl-observability.clickhouse" . }}-schema
