[project]
name = "grl"
version = "0.1.0"
description = "CLI for GRL training runs and cluster orchestration"
readme = "README.md"
authors = [
    { name = "Gerardo Salazar", email = "gfsalazar01@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35.0",
    "grpcio>=1.81.1",
    "kubernetes>=31.0.0",
    "protobuf>=5.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
grl = "grl.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grl", "src/grl_config", "src/grl_proto"]
include = ["src/grl/data/**/*.md"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
