[package]
name = "grl-string-reverse"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "grl-string-reverse"
path = "src/main.rs"

[dependencies]
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
vsock = "0.5"

[dev-dependencies]
pretty_assertions = "1"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"
